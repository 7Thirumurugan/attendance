


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
/* ============================================= */
/* ADVANCED STYLED ADMIN PAGE (PERFECT ALIGNMENT) */
/* ============================================= */

/* General Body */
body {
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #e0f7fa, #f1f8e9);
  color: #333;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

/* Main Container */
.container {
  width: 90%;
  max-width: 1100px;
  background: #ffffffec;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  padding: 40px 35px;
  margin: 40px 0;
  animation: fadeIn 0.9s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Title */
h1 {
  color: #00796b;
  font-size: 2.3rem;
  text-align: center;
  margin-bottom: 25px;
  text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
}

/* Top Button Section */
.top-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin-bottom: 30px;
}

/* Buttons */
button, a.btn {
  background: linear-gradient(90deg, #00bfa5, #00796b);
  color: #fff;
  padding: 12px 30px;
  border-radius: 30px;
  text-decoration: none;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

button:hover, a.btn:hover {
  background: linear-gradient(90deg, #00796b, #004d40);
  transform: scale(1.05) translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

/* Filter Form */
form {
  width: 100%;
  max-width: 600px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 30px;
}

input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 15px;
  transition: all 0.3s ease;
  background: #fff;
}

input:focus {
  outline: none;
  border-color: #00796b;
  box-shadow: 0 0 10px rgba(0, 121, 107, 0.3);
}

/* Table Wrapper */
.table-wrapper {
  width: 100%;
  overflow-x: auto;
  border-radius: 15px;
  background: #fff;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
}

/* Table Styles */
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
}

th {
  background: linear-gradient(90deg, #00796b, #004d40);
  color: white;
  padding: 14px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  text-align: center;
  font-size: 0.9rem;
}

td {
  padding: 13px;
  border-bottom: 1px solid #ddd;
  text-align: center;
  vertical-align: middle;
}

tr:hover {
  background-color: #e0f2f1;
  transition: background 0.3s ease;
}

/* Animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive Design */
@media (max-width: 768px) {
  h1 {
    font-size: 1.8rem;
  }
  form {
    flex-direction: column;
  }
  input, button {
    width: 100%;
  }
  table {
    font-size: 14px;
  }
}
</style>
</head>

<body>
  <div class="container">
    <h1>👨‍💼 Admin Dashboard</h1>

    <!-- Top Buttons -->
    <div class="top-buttons">
      <a href="/download_attendance" class="btn">⬇ Download CSV</a>
      <a href="{{ url_for('admin_logout') }}" class="btn">🚪 Logout</a>
    </div>

    <!-- Filter Form -->
    <form method="POST" action="/filter_attendance">
      <input type="text" name="keyword" placeholder="🔍 Search by name or date">
      <button type="submit">Filter</button>
    </form>

    <!-- Table -->
    <div class="table-wrapper">
      <table>
        <tr>
          <th>S.No</th>
          <th>Name</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
        {% for name, info in data.items() %}
        <tr>
          <td>{{ loop.index }}</td>
          <td>{{ name }}</td>
          <td>{{ info.date }}</td>
          <td>{{ info.time }}</td>
        </tr>
        {% endfor %}
      </table>
    </div>
  </div>
</body>
</html>
