
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Report</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #f0f8ff, #e6f7ff);
      text-align: center;
      padding: 20px;
      color: #333;
    }
    h1 { color: #00796b; }
    table {
      border-collapse: collapse;
      width: 80%;
      margin: 20px auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      background-color: #fff;
      border-radius: 10px;
    }
    th {
      background: linear-gradient(90deg, #00796b, #004d40);
      color: white;
      padding: 10px;
    }
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    tr:hover { background-color: #e0f2f1; }
    a.delete-btn {
      background: linear-gradient(90deg, #ef5350, #c62828);
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
    }
    a.delete-btn:hover { background: linear-gradient(90deg, #c62828, #910000); }
    .btn { margin: 10px; padding: 10px 20px; border-radius: 25px; background: #00796b; color: white; text-decoration: none; }
  </style>
</head>
<body>

<h1>📋 Attendance Report</h1>



<a href="/" class="btn">⬅ Back to Camera</a>


<a href="{{ url_for('admin_login') }}" class="btn">👨‍💼 Admin Login</a>

<table>
  <tr>
    <th>S.No</th>
    <th>Name</th>
    <th>Date</th>
    <th>Time</th>
    <th>Action</th>
    
  </tr>
  {% set count = 1 %}
  {% for row in data %}
  <tr>
    <td>{{ loop.index }}</td>
    <td>{{ row.student_name }}</td>
    <td>{{ row.date }}</td>
    <td>{{ row.time }}</td>
    <td>
     <form action="{{ url_for('delete_attendance', id=row.id) }}" method="POST" style="display:inline;">
    <button type="submit" class="btn btn-danger">Delete</button>
    </form>


    </td>
  </tr>
  {% set count = count + 1 %}
  {% endfor %}
</table>

</body>
</html>
